name: Verify Orbitalis

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Immutable action revisions match the reference Compukters workflow.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - name: Verify all current targets, archive and laboratory GameTests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/agent-logs
          ./gradlew --no-daemon --parallel --max-workers=2 \
            -Porg.gradle.java.installations.paths="$JAVA_HOME_21_X64,$JAVA_HOME_25_X64" \
            verifyLocalFull :v1_21_1-neoforge:runGameTestServer 2>&1 | tee build/agent-logs/ci.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: orbitalis-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/agent-logs/
            modules/minecraft/v1_21_1/v1_21_1-neoforge/build/libs/*.jar
            modules/minecraft/v1_21_1/v1_21_1-neoforge/build/test-results/gameTestServer/
          if-no-files-found: warn
          retention-days: 7
