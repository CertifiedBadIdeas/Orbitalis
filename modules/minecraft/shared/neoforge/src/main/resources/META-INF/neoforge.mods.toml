modLoader="javafml"
loaderVersion="[4,)"
license="Apache-2.0"

[[mods]]
modId="orbitalis"
version="${mod_version}"
displayName="Orbitalis"
description='''Explore finite worlds, fly into orbit, and visit the Moon. Includes an orbital map, planetary gravity and optional Sable construction and Propulsion flight-control integrations.'''

[[mixins]]
config="orbitalis.mixins.json"

[[dependencies.orbitalis]]
modId="neoforge"
type="required"
versionRange="[21.1.252,21.2)"
ordering="NONE"
side="BOTH"

[[dependencies.orbitalis]]
modId="minecraft"
type="required"
versionRange="[1.21.1,1.21.2)"
ordering="NONE"
side="BOTH"

[[dependencies.orbitalis]]
modId="sable"
type="optional"
versionRange="[2.0.6]"
ordering="AFTER"
side="BOTH"

# External client renderers remain separately installed; never nested in Orbitalis.
[[dependencies.orbitalis]]
modId="voxy"
type="optional"
versionRange="[0.2.16-beta]"
ordering="AFTER"
side="CLIENT"

[[dependencies.orbitalis]]
modId="voxyworldgenv2"
type="optional"
versionRange="[2.4.2]"
ordering="AFTER"
side="CLIENT"

# Engine integration is optional; implementations remain independently installed.
[[dependencies.orbitalis]]
modId="createpropulsion"
type="optional"
versionRange="[1.1.5]"
ordering="AFTER"
side="BOTH"
